import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id "architectury-plugin" apply false
    id "dev.architectury.loom" apply false
    id "com.github.johnrengelman.shadow" version "7.1.2" apply false
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "architectury-plugin"

    architectury {
        minecraft = mc_version
    }

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:$mc_version"
        mappings loom.officialMojangMappings()
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "maven-publish"

    version = mod_version
    group = rootProject.group

    repositories {
        maven { url = "https://www.cursemaven.com" }
        maven { url = "https://maven.architectury.dev" }
        mavenLocal()
        mavenCentral()
    }

    dependencies {
        compileOnly group: "org.jetbrains", name: "annotations", version: "24.1.0"
        compileOnly group: "javax.annotation", name: "javax.annotation-api", version: "1.3.2"
        compileOnly group: "com.google.code.findbugs", name: "jsr305", version: "3.0.2"

        compileOnly group: "org.projectlombok", name: "lombok", version: "1.18.30"
        annotationProcessor group: "org.projectlombok", name: "lombok", version: "1.18.30"

        testImplementation group: "org.junit.jupiter", name: "junit-jupiter-api", version: "5.10.2"
        testRuntimeOnly group: "org.junit.jupiter", name: "junit-jupiter-engine", version: "5.10.2"
    }

    task processSource(type: Sync) {
        from sourceSets.main.java
        inputs.properties(
            mod_version: mod_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_core_version: mod_core_version
        )
        filesMatching(["**/Reference.java"]) {
            filter(ReplaceTokens, tokens: [
                MOD_VERSION: mod_version,
                MOD_CORE_VERSION: mod_core_version,
                MOD_ID: mod_id,
                MOD_NAME: mod_name
            ])
        }
        into "$buildDir/src"
    }

    compileJava {
        source = processSource.outputs
        options.compilerArgs << "-parameters"
    }

    jar {
        archiveBaseName = "$archive_base-$platform"
    }

    tasks.withType(Test) {
        useJUnitPlatform()
        ignoreFailures = false
        failFast = true
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
    }
}
