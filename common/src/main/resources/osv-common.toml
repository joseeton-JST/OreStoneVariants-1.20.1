# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║              OreStoneVariants (OSV) - Common Configuration                     ║
# ║              Server-side and shared mod behavior settings                       ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝
#
# This file controls the core behavior of OreStoneVariants:
#  - Which ores spawn in which blocks
#  - World generation settings
#  - Compatibility with other mods
#
# After editing, restart your game/server for changes to take effect.

[blockRegistry]
# ────────────────────────────────────────────────────────────────────────────────
# BLOCK REGISTRY - Configure which ore variants spawn where
# ────────────────────────────────────────────────────────────────────────────────
#
# Syntax: "ore_name background_block"
# Examples:
#   coal_ore stone          → Coal ore spawns in stone
#   iron_ore sand           → Iron ore spawns in sand
#   propertyGroup blockGroup → All ores in propertyGroup spawn in blockGroup
#
# Special names:
#   "all"     → All ores and background blocks
#   "default" → Only default/recommended ores
#
# This value uses all ores in all ore property groups, spawning in all stone types
values = ["all all"]

# Validate the registry for duplicate ore/background combinations on startup
# Useful for catching configuration mistakes
checkForDuplicates = true

# ────────────────────────────────────────────────────────────────────────────────
# Block Groups: Categories of background blocks where ores can spawn
# ────────────────────────────────────────────────────────────────────────────────
# Dynamic category - populated automatically with stone types from all mods
# Examples: stone, andesite, diorite, granite, deepslate, etc.
[blockRegistry.blockGroups]

# ────────────────────────────────────────────────────────────────────────────────
# Property Groups: Categories of ores that can spawn together
# ────────────────────────────────────────────────────────────────────────────────
# Dynamic category - populated automatically with ore types from all mods
# Examples: coal, iron, gold, diamond, etc.
[blockRegistry.propertyGroups]

[general]
# ────────────────────────────────────────────────────────────────────────────────
# GENERAL SETTINGS
# ────────────────────────────────────────────────────────────────────────────────

# Update preset configs when the mod is updated
# MOD_UPDATED: Apply fixes when OSV version changes (recommended)
# USER_CONFIGURED: Never auto-update (preserve user customizations)
# OFF: Never auto-update
updatePresets = "MOD_UPDATED"

# Force compatibility mode for platforms with limited block property support
# Disables: block imitation, dynamic properties, and similar features
# Usually auto-enabled when needed; only set manually if problems occur
forceCompatibilityMode = false

# Enable detailed startup logging (for debugging)
# Check your logs folder for startup diagnostics
debugStartup = false

[blocks]
# ────────────────────────────────────────────────────────────────────────────────
# BLOCK BEHAVIOR - How ore variants behave
# ────────────────────────────────────────────────────────────────────────────────

# Ore variants imitate their background block's properties
# Examples of imitated properties: falling (sand), sustaining leaves (grass), etc.
# When disabled: all ore variants behave like stone
bgImitation = true

# Prevent background blocks from duplicating via ore variants
# Example: sand ores normally create sand when broken; disable to prevent infinite sand
# Affects: redstone ores, lava ores, water ores, and block spreaders (silverfish, etc.)
bgDuplication = true

# Enable furnace recipes that smelt ore variants into items
enableFurnaceRecipes = true

# Ore variants drop themselves instead of original ore drops
# When enabled: mining coal ore in stone drops coal ore (not raw coal)
# When disabled: coal ore in stone drops raw coal (vanilla behavior)
variantsDrop = false

# Ore variants drop when using silk touch enchantment
variantsDropWithSilkTouch = true

# Allow silverfish to infest ore variant blocks
# When enabled: silverfish can enter any infested ore variant
mapInfestedVariants = true

[tags]
# ────────────────────────────────────────────────────────────────────────────────
# TAG COPYING - Apply vanilla tags to ore variants
# ────────────────────────────────────────────────────────────────────────────────
# Minecraft uses "tags" to group blocks/items (e.g., "mineable/pickaxe")
# These tags control behavior: mining speed, tool requirements, drops, etc.

# Master toggle: copy any tags at all
copyTags = true

# Copy block tags (e.g., "mineable/pickaxe", "needs_diamond_tool")
copyBlockTags = true

# Copy item tags (for crafting recipes, etc.)
copyItemTags = true

[denseOres]
# ────────────────────────────────────────────────────────────────────────────────
# DENSE ORE VARIANTS - Ore clusters with multiple drops
# ────────────────────────────────────────────────────────────────────────────────

# Enable dense ore variants (bonus ore clusters with more drops)
enabled = true

# Minimum multiplier for dense ore drops (e.g., 1 = 1x normal drops)
minMultiplier = 1

# Maximum multiplier for dense ore drops (e.g., 3 = 3x normal drops)
maxMultiplier = 3

# Randomize drop count: drop between min and max multiplier
# When true: each dense ore drops random 1x-3x amounts
# When false: dense ore always drops max multiplier (3x)
randomDropCount = true

[worldGen]
# ────────────────────────────────────────────────────────────────────────────────
# WORLD GENERATION - Ore spawn behavior
# ────────────────────────────────────────────────────────────────────────────────

# Ores spawn only in biomes where they naturally occur
# When disabled: ores can spawn anywhere (e.g., coal ore in deserts)
biomeSpecific = true

# Disable vanilla ore generation before OSV ores spawn
# Prevents: duplicates, unwanted vanilla ores mixed with variants
# Recommended: keep enabled
autoDisableOres = true

# Disable vanilla stone variant generation
# Recommended: keep enabled
autoDisableStone = true

# Enable OSV ore variant generation
# Set to false to use vanilla ores instead
enableOSVOres = true

# Enable OSV stone variant generation
# Set to false to use vanilla stone types instead
enableOSVStone = true

# Use strict vanilla-compatible datapack worldgen behavior
# When enabled: complex generation settings preserved (slower, more accurate)
# When disabled: OSV simplifies some settings (faster, may reduce compatibility)
# Recommended: false (unless using complex custom worldgen datapacks)
highAccuracy = false

# List of worldgen feature IDs to disable
# Find available IDs with: /osv debug features (in-game command)
# Example: disable Create mod zinc ore if you prefer another variant source
disabledFeatures = ["create:zinc_ore"]

[modSupport]
# ────────────────────────────────────────────────────────────────────────────────
# MOD COMPATIBILITY - Enable/disable variants for specific mods
# ────────────────────────────────────────────────────────────────────────────────
# Dynamically populated with installed mods
# Examples: minecraft, create, quark, biomesoplenty, etc.
# Set each to false to disable variants from that mod
