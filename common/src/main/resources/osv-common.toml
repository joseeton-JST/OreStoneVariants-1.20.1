# OreStoneVariants Common Configuration
# This file handles server-side and shared mod behavior

[blockRegistry]
# You can use this registry to add as many new ore types as you like using any
# background block at all. Block models, textures, world generation, and other
# properties are handled dynamically. These blocks will only spawn in whichever
# block or block state is listed as the background block. The ores retain a mixture
# of their original properties + those of their background.
#
# The basic syntax is like this: "<ore> <background>." For example, to spawn
# coal ore inside of sand, you would type "coal_ore sand." Alternatively, you
# can list out any number of ore blocks inside of a new or existing PropertyGroup
# below and use its name in the place of "<ore>." Likewise, "<background>" can
# be replaced with the name of a BlockGroup, as registered below.
#
# Some block and property groups have special names. Those are "all" and
# "default." Using "all" in the place of either will gather all of the respective
# entries from below and add them to the list dynamically. Using "default" in the
# place of either will gather all of the entries that are listed *by default*.
values = ["all all"]

# Whether to test the block registry for duplicate entries
checkForDuplicates = true

# Block groups mapping (dynamic category)
[blockRegistry.blockGroups]
# Default stone groups are configured dynamically

# Property groups mapping (dynamic category)
[blockRegistry.propertyGroups]
# Default ore property groups are configured dynamically

[general]
# Whether to run transformations on the ore presets for backwards compatibility
updatePresets = "MOD_UPDATED"

# Whether to forcibly disable dynamic block imitation features to provide
# better compatibility with some platforms. Note that this feature should
# get enabled automatically, if needed.
forceCompatibilityMode = false

# Enable extra startup diagnostics and snapshots in logs
debugStartup = false

[blocks]
# Variants will imitate the properties of their background blocks, such as the
# ability to fall like sand or sustain leaves. Can be configured on an
# individual basis in the ore presets.
bgImitation = true

# Whether to suppress the ability for background blocks to duplicate themselves.
# Enabling this may improve gameplay balance by not letting ores spread in the
# world unexpectedly. Can be configured on an individual basis in the ore presets.
bgDuplication = true

# Whether furnace recipes should be enabled
enableFurnaceRecipes = true

# Whether ore variants will drop instead of original counterparts
variantsDrop = false

# Whether ore variants will drop when using silk touch
variantsDropWithSilkTouch = true

# Whether to allow silverfish to enter into any infested variants
mapInfestedVariants = true

[tags]
# Whether to copy any tags at all. Globally toggles the copy feature.
copyTags = true

# Whether to copy block tags
copyBlockTags = true

# Whether to copy item tags
copyItemTags = true

[denseOres]
# Whether dense variants are spawned
enabled = true

# The minimum multiplier for dense ore counts
minMultiplier = 1

# The maximum multiplier for dense ore counts
maxMultiplier = 3

# If true, dense variants drop a random number between min and max multipliers
randomDropCount = true

[worldGen]
# Whether ores should spawn according to specific biomes vs. anywhere
biomeSpecific = true

# Whether vanilla spawning of ores should be blocked
autoDisableOres = true

# Whether vanilla spawning of stone variants should be blocked
autoDisableStone = true

# Whether to spawn custom ore variants
enableOSVOres = true

# Whether to spawn stone types with custom variables
enableOSVStone = true

# Whether to keep worldgen using vanilla-compatible datapack behavior.
# When disabled, OSV may simplify some foreign settings.
highAccuracy = false

# Add configured feature IDs to disable spawning for those features
# Use '/osv debug features' in game to list available IDs
disabledFeatures = ["create:zinc_ore"]

[modSupport]
# Mod support toggles (configured dynamically)
# Default support for various mods will be auto-configured here
