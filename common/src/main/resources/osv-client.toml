# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║                 OreStoneVariants (OSV) - Client Configuration                  ║
# ║                     Customize your client-side experience                       ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝
#
# This file controls how ore variants are rendered on your client.
# Changes take effect immediately after reloading resources (F3+T in-game).

[resources]
# ────────────────────────────────────────────────────────────────────────────────
# RESOURCE PACK ASSET GENERATION
# ────────────────────────────────────────────────────────────────────────────────

# Whether to attempt generating ore sprites from your active resource pack
# When enabled: OSV extracts textures from your topmost resource pack
# When disabled: OSV uses default textures from its own pack
# Note: Not all resource packs are compatible; you may see missing textures
assetsFromRP = true

[models]
# ────────────────────────────────────────────────────────────────────────────────
# BLOCK MODEL RENDERING
# ────────────────────────────────────────────────────────────────────────────────

# Enable shading (lighting) in generated ore models
# This adds depth and shadow details to ore blocks
# Set to false if you prefer flat/simple ore appearance
overlayShade = true

# Support for full transparency/alpha in ore textures
# Allows textures with semi-transparent pixels (e.g., moss, vines on ore)
# Set to false if you use shaders that conflict with transparency
overlayTransparency = true

# Scale multiplier for ore overlay relative to background block
# Range: 1.0 (exact fit) to 2.0 (very enlarged)
# Higher values show more overlay detail but can cause z-fighting (flickering)
# Recommended: 1.001 - 1.005 (minimal but visible separation)
overlayScale = 1.001

# Default model generation style for all ores
# Options: SINGLE, LAYERED, CUSTOM
# SINGLE: one texture layer (most compatible, least detailed)
# LAYERED: multiple layers (better detail, requires good GPU)
# CUSTOM: user-defined per ore (most control, requires manual config)
type = "SINGLE"

[textures]
# ────────────────────────────────────────────────────────────────────────────────
# TEXTURE PROCESSING
# ────────────────────────────────────────────────────────────────────────────────

# Use opacity variation in textures for visual depth
# The overlay texture can use variable transparency to create shadow/highlight effects
# Set to false for flat texture appearance
shadeModifier = true

[blocks]
# ────────────────────────────────────────────────────────────────────────────────
# GAMEPLAY RENDERING
# ────────────────────────────────────────────────────────────────────────────────

# Auto-reload resources after enabling/disabling the OSV resource pack
# When enabled: game automatically reloads textures (may cause brief freeze)
# When disabled: you must reload manually (F3+T) to see changes
# Helps reduce missing texture errors in some cases
autoRefresh = false

[items]
# ────────────────────────────────────────────────────────────────────────────────
# ITEM DISPLAY FORMATTING
# ────────────────────────────────────────────────────────────────────────────────
# Configure how ore names and ore items display (e.g., "Coal Ore (Stone)")
#
# Available properties for each formatter:
#   text:       The display text template using placeholders:
#               {fg} = foreground block (the ore), {bg} = background block
#   color:      Common color name (red, blue, etc.) or hex #RRGGBB
#   bold:       true/false - bold font
#   italic:     true/false - italic font
#   underlined: true/false - underlined text
#   font:       custom font namespace:id (usually best to leave default)
#
# Examples:
#   text = "{fg} in {bg}" → "Coal Ore in Stone"
#   text = "{fg} ({bg})" → "Coal Ore (Stone)"
#   text = "✦ {fg}" (with special characters)
#
# NOTE: Formatters are auto-generated and may be overwritten
