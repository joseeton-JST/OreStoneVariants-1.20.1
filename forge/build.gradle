plugins {
    id "com.github.johnrengelman.shadow"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "osv.mixins.json"
        mixinConfig "osv.mixins.forge.json"
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) {
        transitive = false
    }
    common(project(path: ":common", configuration: "namedElements")) {
        transitive = false
    }

    forge "net.minecraftforge:forge:$mc_version-$forge_version"
    modApi "dev.architectury:architectury-forge:$architectury_version"
    modApi "io.github.joseetoon:genlib-forge:$genlib_version"
    modCompileOnly "curse.maven:Create-328085:$create_maven_forge_version"
}

jar {
    manifest {
        attributes(
            "Specification-Title": mod_name,
            "Specification-Vendor": mod_vendor,
            "Specification-Version": mod_version,
            "Implementation-Title": mod_id,
            "Implementation-Version": mod_version,
            "Implementation-Vendor": mod_vendor,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs": "osv.mixins.json"
        )
    }
}

processResources {
    filesMatching(["META-INF/mods.toml", "pack.mcmeta"]) {
        expand project.properties
    }
}

shadowJar {
    exclude "fabric.mod.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = ""
}
